<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/music/audio-data.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #09090b;
        font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; --pulse: 0; }
      .clip { position: absolute; inset: 0; }
      [data-composition-src] { position: absolute; inset: 0; }

      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .eyebrow { font-size: 19px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #a1a1aa; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
      .dot-live { background: #10b981; box-shadow: 0 0 10px rgba(16,185,129,.85); }
      .dot-idle { background: #52525b; }
      .dot-cam { background: #128aa9; box-shadow: 0 0 8px rgba(18,138,169,.8); }
      .dot-ok  { background: #10b981; }
      .dot-warn{ background: #f59e0b; }
      .dot-off { background: #ef4444; }

      /* ---------- global overlays ---------- */
      #vignette { position: absolute; inset: 0; z-index: 60; pointer-events: none;
        background: radial-gradient(ellipse 78% 74% at 50% 48%, rgba(0,0,0,0) 46%, rgba(0,0,0,.58) 100%); }
      #scan { position: absolute; inset: 0; z-index: 61; pointer-events: none; opacity: .04;
        background-image: repeating-linear-gradient(0deg, #ffffff 0 1px, rgba(0,0,0,0) 1px 3px); }
      #endfade { position: absolute; inset: 0; z-index: 62; pointer-events: none; background: #09090b; opacity: 0; }

      /* ================= SCENE 1 — pipeline hook ================= */
      .s1-head { position: absolute; top: 74px; left: 120px; right: 120px; display: flex; align-items: center; gap: 14px; }
      .s1-head .brand { color: #f4f4f5; font-weight: 600; letter-spacing: .12em; font-size: 20px; }
      .s1-head .sep { color: #3f3f46; }
      .s1-head .tag { color: #a1a1aa; font-size: 18px; letter-spacing: .1em; }
      .s1-head .rt { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #a1a1aa; font-size: 17px; letter-spacing: .1em; }
      .s1-foot { position: absolute; bottom: 96px; left: 0; right: 0; text-align: center; color: #8b8b93; font-size: 19px; letter-spacing: .22em; }
      #term { position: absolute; left: 160px; top: 320px; width: 1600px; border-radius: 18px; overflow: hidden; background: #0d0d11; border: 1px solid rgba(244,244,245,.13); }
      .term-bar { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: #16161b; border-bottom: 1px solid rgba(244,244,245,.09); }
      .tb-dots { display: flex; gap: 8px; }
      .tb-dots i { width: 11px; height: 11px; border-radius: 50%; background: #3f3f46; }
      .tb-dots i:nth-child(1) { background: #ef4444; }
      .tb-dots i:nth-child(2) { background: #f59e0b; }
      .tb-dots i:nth-child(3) { background: #10b981; }
      .tb-title { color: #d4d4d8; font-size: 18px; letter-spacing: .04em; }
      .tb-meta { margin-left: auto; color: #128aa9; font-size: 17px; letter-spacing: .14em; }
      .term-body { padding: 44px 44px 38px; }
      .tline { font-size: 36px; line-height: 1.62; color: #d4d4d8; white-space: nowrap; letter-spacing: .01em; }
      .twipe { display: inline-block; }
      .caret { display: inline-block; width: .56em; height: 1.02em; background: #128aa9; vertical-align: -.16em; margin-left: 4px; }
      .tk-alert { color: #f4f4f5; font-weight: 700; }
      .tstatus { display: flex; align-items: center; gap: 12px; margin-top: 30px; font-size: 21px; letter-spacing: .16em; color: #ef4444; }
      .warnmark { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #ef4444; color: #ef4444; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

      /* ================= shared app chrome ================= */
      .appwin { position: absolute; border-radius: 16px; overflow: hidden; background: #101014; border: 1px solid rgba(244,244,245,.13); }
      .win-bar { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #17171c; border-bottom: 1px solid rgba(244,244,245,.09); }
      .win-bar .title { color: #e4e4e7; font-size: 17px; font-weight: 600; letter-spacing: .04em; }
      .win-bar .rt { margin-left: auto; display: flex; align-items: center; gap: 9px; color: #10b981; font-size: 15px; letter-spacing: .14em; }
      .stat-bar { height: 42px; display: flex; align-items: center; gap: 26px; padding: 0 20px; background: #0b0b0e; border-top: 1px solid rgba(244,244,245,.09); color: #a1a1aa; font-size: 15px; letter-spacing: .06em; }
      .stat-bar b { color: #e4e4e7; font-weight: 600; }
      .stat-bar .right { margin-left: auto; color: #128aa9; }

      /* ---- camera panel ---- */
      .camstrip { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #0d0d11; border-bottom: 1px solid rgba(244,244,245,.07); }
      .chip { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 14px; border-radius: 8px; background: #191920; border: 1px solid rgba(244,244,245,.1); color: #a1a1aa; font-size: 15px; letter-spacing: .1em; }
      .chip.on { background: rgba(14,111,138,.24); border-color: rgba(18,138,169,.6); color: #e4e4e7; }
      .strip-meta { margin-left: auto; color: #8b8b93; font-size: 14px; letter-spacing: .14em; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; padding: 16px; height: 784px; }
      .cam { position: relative; border-radius: 11px; overflow: hidden; background: #0b0e13; border: 1px solid rgba(244,244,245,.08); }
      .cam-view { position: absolute; inset: 0; background: linear-gradient(180deg, #1d2733 0%, #172029 44%, #10151c 44.4%, #0b0f14 100%); }
      .cam-view.street2 { background: linear-gradient(180deg, #1b232e 0%, #151d26 46%, #0e131a 46.4%, #090c11 100%); }
      .cam-view.hall { background: linear-gradient(180deg, #20262e 0%, #181d25 52%, #101419 52.4%, #0a0d11 100%); }
      .cam-view.dead { background: linear-gradient(180deg, #101318 0%, #0b0e12 100%); }
      .bld { position: absolute; bottom: 55%; background: #131a23; border-top: 2px solid rgba(18,138,169,.16); }
      .road { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(180deg, #0d1116 0%, #080a0e 100%); }
      .lanemark { position: absolute; left: 50%; bottom: 12%; width: 3px; height: 26%; background: rgba(244,244,245,.07); }
      .letterbox { position: absolute; left: 0; right: 0; background: #05070a; }
      .letterbox.t { top: 0; height: 9px; }
      .letterbox.b { bottom: 0; height: 9px; }
      .camscan { position: absolute; inset: 0; opacity: .07; background-image: repeating-linear-gradient(0deg, #ffffff 0 1px, rgba(0,0,0,0) 1px 3px); }
      .hud { position: absolute; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 11px; border-radius: 7px; background: rgba(5,7,10,.82); border: 1px solid rgba(244,244,245,.16); color: #e4e4e7; font-size: 14px; letter-spacing: .1em; }
      .hud.tl { top: 14px; left: 14px; }
      .hud.tr { top: 14px; right: 14px; }
      .hud.br { bottom: 14px; right: 14px; color: #128aa9; }
      .hud.bl { bottom: 14px; left: 14px; }
      .nosignal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; color: #8b8b93; font-size: 19px; letter-spacing: .2em; }

      /* ---- tracked figure + box ---- */
      .figure { position: absolute; }
      .fig-head { position: absolute; left: 50%; transform: translateX(-50%); width: 46px; height: 52px; border-radius: 50%; background: #46515f; }
      .fig-body { position: absolute; left: 50%; transform: translateX(-50%); width: 118px; height: 92px; border-radius: 46px 46px 10px 10px; background: #3a4553; }
      .trackbox { position: absolute; border: 3px solid #128aa9; border-radius: 8px; }
      .tb-corner { position: absolute; width: 20px; height: 20px; background: #128aa9; }
      .tb-corner.tl { top: -3px; left: -3px; }
      .tb-corner.tr { top: -3px; right: -3px; }
      .tb-corner.bl { bottom: -3px; left: -3px; }
      .tb-corner.br { bottom: -3px; right: -3px; }
      /* Dark chip + light text keeps the label readable in every state
         (~15.7:1) instead of tinting the fill and relying on fill-vs-text contrast. */
      .tb-label { position: absolute; top: -34px; left: -3px; height: 28px; border-radius: 7px; background: #09090b; border: 1px solid rgba(228,228,231,.26); color: #e4e4e7; font-size: 15px; font-weight: 700; letter-spacing: .1em; white-space: nowrap; }
      .tb-label i { position: absolute; left: 0; top: 0; height: 28px; display: flex; align-items: center; padding: 0 12px; font-style: normal; opacity: 0; }
      .grid-caption { position: absolute; left: 50%; transform: translateX(-50%); bottom: 34px; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 26px; border-radius: 12px; background: rgba(8,10,14,.9); border: 1px solid rgba(244,244,245,.14); color: #d4d4d8; font-size: 18px; letter-spacing: .1em; }
      .grid-caption b { color: #10b981; font-weight: 700; }

      /* ================= SCENE 3 — alert comparison ================= */
      #alertcard { position: absolute; left: 300px; top: 100px; width: 1320px; height: 880px; border-radius: 18px; overflow: hidden; background: #101014; border: 1px solid rgba(244,244,245,.14); display: flex; flex-direction: column; }
      .ac-head { height: 74px; display: flex; align-items: center; gap: 16px; padding: 0 28px; background: #17171c; border-bottom: 1px solid rgba(244,244,245,.09); }
      .ac-bar { width: 5px; height: 34px; border-radius: 3px; background: #ef4444; }
      .ac-title { color: #f4f4f5; font-size: 23px; font-weight: 700; letter-spacing: .05em; }
      .ac-meta { margin-left: auto; color: #a1a1aa; font-size: 17px; letter-spacing: .1em; }
      .ac-body { flex: 1; display: flex; flex-direction: column; padding: 26px 30px 24px; }
      .cmp { display: flex; align-items: flex-start; gap: 30px; }
      .face { width: 320px; }
      .face-img { position: relative; width: 320px; height: 320px; border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, #2b3542 0%, #1f2833 62%, #18202a 100%); border: 3px solid #128aa9; }
      .face-img.live { border-color: #10b981; }
      .face-img .fig-head { width: 108px; height: 122px; top: 92px; background: #5c6a7a; }
      .face-img .fig-body { width: 250px; height: 168px; top: 208px; background: #495666; border-radius: 100px 100px 12px 12px; }
      .face-xhair { position: absolute; inset: 0; }
      .face-xhair i { position: absolute; width: 34px; height: 34px; border: 3px solid #10b981; }
      .face-xhair i:nth-child(1) { top: 12px; left: 12px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
      .face-xhair i:nth-child(2) { top: 12px; right: 12px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
      .face-xhair i:nth-child(3) { bottom: 12px; left: 12px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
      .face-xhair i:nth-child(4) { bottom: 12px; right: 12px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
      .face-cap { margin-top: 14px; }
      .face-cap .n { color: #f4f4f5; font-size: 21px; font-weight: 600; letter-spacing: .03em; }
      .face-cap .m { margin-top: 5px; color: #a1a1aa; font-size: 15px; letter-spacing: .1em; }
      .cmp-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 62px; }
      .vs-chip { width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1c1c22; border: 2px solid rgba(244,244,245,.2); color: #d4d4d8; font-size: 22px; font-weight: 700; letter-spacing: .06em; }
      .vs-rule { width: 2px; flex: 1; background: linear-gradient(180deg, rgba(244,244,245,0), rgba(244,244,245,.2), rgba(244,244,245,0)); }
      .gauge { margin-top: 24px; }
      .gauge-top { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 12px; }
      .gauge-lbl { color: #a1a1aa; font-size: 16px; letter-spacing: .18em; }
      .gauge-num { margin-left: auto; color: #10b981; font-size: 44px; font-weight: 700; line-height: 1; }
      .gauge-track { position: relative; width: 100%; height: 18px; border-radius: 9px; background: #26262f; box-shadow: 0 0 calc(4px + 16px * var(--pulse)) rgba(16,185,129, calc(.10 + .28 * var(--pulse))); }
      .gauge-fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 9px; background: #10b981; transform: scaleX(0); transform-origin: left center; }
      .gauge-thr { position: absolute; top: -7px; bottom: -7px; width: 2px; background: #d4d4d8; opacity: .65; }
      .gauge-thr-lbl { position: absolute; top: 26px; color: #a1a1aa; font-size: 14px; letter-spacing: .1em; transform: translateX(-50%); }
      .meta-grid { margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
      .meta-row { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 16px; border-radius: 10px; background: #16161b; border: 1px solid rgba(244,244,245,.07); }
      .meta-row .k { color: #a1a1aa; font-size: 15px; letter-spacing: .12em; }
      .meta-row .v { margin-left: auto; color: #f4f4f5; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
      .meta-row .v.ok { color: #10b981; }
      .ac-foot { height: 88px; display: flex; align-items: center; gap: 16px; padding: 0 30px; background: #0b0b0e; border-top: 1px solid rgba(244,244,245,.09); }
      .btn { height: 46px; display: flex; align-items: center; padding: 0 28px; border-radius: 11px; font-size: 18px; font-weight: 600; letter-spacing: .1em; }
      .btn.ghost { color: #d4d4d8; background: #1a1a20; border: 1px solid rgba(244,244,245,.16); }
      .btn.confirm { margin-left: auto; color: #04140d; background: #10b981; }
      .ac-note { color: #8b8b93; font-size: 15px; letter-spacing: .12em; }

      /* ================= SCENE 4 — timeline + map ================= */
      .s4-frame { position: absolute; left: 130px; top: 84px; width: 1660px; height: 890px; display: flex; gap: 20px; }
      .s4-panel { border-radius: 16px; overflow: hidden; background: #101014; border: 1px solid rgba(244,244,245,.13); display: flex; flex-direction: column; }
      .p-head { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 22px; background: #17171c; border-bottom: 1px solid rgba(244,244,245,.09); }
      .p-head .t { color: #f4f4f5; font-size: 19px; font-weight: 600; letter-spacing: .1em; }
      .p-head .c { margin-left: auto; color: #a1a1aa; font-size: 15px; letter-spacing: .1em; }
      .tbl-head, .tbl-row { display: grid; grid-template-columns: 150px 1fr 150px 120px 190px; align-items: center; gap: 10px; padding: 0 22px; }
      .tbl-head { height: 46px; color: #8b8b93; font-size: 14px; letter-spacing: .16em; background: #0d0d11; border-bottom: 1px solid rgba(244,244,245,.08); }
      .tbl-row { height: 66px; border-bottom: 1px solid rgba(244,244,245,.055); background: #0f0f13; }
      .tbl-row.sel { background: rgba(16,185,129,.1); box-shadow: inset 3px 0 0 #10b981; }
      .tbl-row .c-time { color: #d4d4d8; font-size: 18px; }
      .tbl-row .c-name { color: #f4f4f5; font-size: 18px; font-weight: 600; }
      .tbl-row .c-name.mute { color: #a1a1aa; font-weight: 400; }
      .tbl-row .c-cam { color: #a1a1aa; font-size: 17px; }
      .tbl-row .c-score { font-size: 19px; font-weight: 700; }
      .tbl-row .c-score.ok { color: #10b981; }
      .tbl-row .c-score.warn { color: #f59e0b; }
      .tbl-row .c-score.none { color: #a1a1aa; }
      .pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 13px; border-radius: 8px; font-size: 14px; font-weight: 600; letter-spacing: .1em; }
      .pill.ok { background: rgba(16,185,129,.16); color: #10b981; border: 1px solid rgba(16,185,129,.45); }
      .pill.warn { background: rgba(245,158,11,.15); color: #f59e0b; border: 1px solid rgba(245,158,11,.42); }
      .pill.off { background: rgba(82,82,91,.2); color: #a1a1aa; border: 1px solid rgba(244,244,245,.12); }
      .tbl-foot { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 22px; background: #0b0b0e; color: #8b8b93; font-size: 15px; letter-spacing: .1em; }
      .tbl-foot .r { margin-left: auto; color: #128aa9; }
      .mapwrap { position: relative; flex: 1; }
      .mapbg { position: absolute; inset: 0; background: #0b0e13; }
      .mapbg .blk { position: absolute; background: #131b25; border: 1px solid #1a2430; }
      .mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .marker { position: absolute; transform: translate(-50%, -50%); }
      .mk { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #0b0e13; display: block; }
      .mk.live { background: #10b981; box-shadow: 0 0 calc(6px + 20px * var(--pulse)) rgba(16,185,129, calc(.35 + .45 * var(--pulse))); }
      .mk.past { background: #128aa9; }
      .mk-lbl { position: absolute; left: 50%; transform: translateX(-50%); top: 20px; white-space: nowrap; color: #d4d4d8; font-size: 13px; letter-spacing: .1em; }
      .evcard { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #101014; border-left: 4px solid #10b981; display: flex; flex-direction: column; }
      .ev-head { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #17171c; border-bottom: 1px solid rgba(244,244,245,.09); color: #f4f4f5; font-size: 18px; font-weight: 600; letter-spacing: .1em; }
      .ev-body { flex: 1; padding: 24px 22px; display: flex; flex-direction: column; gap: 24px; }
      .ev-thumb { position: relative; height: 236px; flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #2b3542 0%, #1f2833 62%, #18202a 100%); border: 1px solid rgba(244,244,245,.14); }
      .ev-thumb .fig-head { width: 78px; height: 86px; top: 58px; background: #5c6a7a; }
      .ev-thumb .fig-body { width: 186px; height: 122px; top: 140px; background: #495666; border-radius: 74px 74px 10px 10px; }
      .ev-bbox { position: absolute; left: 50%; transform: translateX(-50%); top: 36px; width: 224px; height: 192px; border: 3px solid #ef4444; border-radius: 8px; }
      .ev-bbox span { position: absolute; top: -30px; left: -3px; height: 26px; display: flex; align-items: center; padding: 0 11px; border-radius: 6px; background: #ef4444; color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .ev-line { display: flex; align-items: center; gap: 12px; color: #a1a1aa; font-size: 15px; letter-spacing: .08em; }
      .ev-line b { margin-left: auto; color: #f4f4f5; font-size: 17px; font-weight: 600; letter-spacing: .03em; }
      .ev-line b.ok { color: #10b981; }
      .ev-foot { height: 74px; display: flex; align-items: center; padding: 0 22px; background: #0b0b0e; border-top: 1px solid rgba(244,244,245,.09); }
      .btn.export { color: #04140d; background: #128aa9; }
      .s4-foot { position: absolute; left: 130px; right: 130px; bottom: 40px; display: flex; align-items: center; gap: 14px; color: #8b8b93; font-size: 16px; letter-spacing: .12em; }
      .s4-foot .r { margin-left: auto; color: #128aa9; }

      /* ================= SCENE 5 — outro ================= */
      .tray { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 22px; border-radius: 11px; background: #121216; border: 1px solid rgba(244,244,245,.13); color: #d4d4d8; font-size: 17px; letter-spacing: .06em; white-space: nowrap; }
      .tray .sub { color: #8b8b93; }
      .logo-row { position: absolute; top: 400px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 26px; }
      .mark { width: 128px; height: 128px; flex: 0 0 auto; border-radius: 30px; background: linear-gradient(145deg, #128aa9 0%, #0e6f8a 100%); position: relative; box-shadow: 0 0 calc(18px + 46px * var(--pulse)) rgba(18,138,169, calc(.28 + .34 * var(--pulse))); }
      .mark .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 74px; height: 74px; border: 4px solid rgba(4,20,26,.75); border-radius: 50%; }
      .mark .dotc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: #04141a; }
      .mark .tick { position: absolute; background: rgba(4,20,26,.8); }
      .mark .tick.h { left: 12px; right: 12px; height: 4px; top: 50%; transform: translateY(-50%); }
      .mark .tick.v { top: 12px; bottom: 12px; width: 4px; left: 50%; transform: translateX(-50%); }
      .wordmark { font-size: 74px; font-weight: 700; letter-spacing: -.015em; color: #f4f4f5; line-height: 1; white-space: nowrap; }
      .tagline { position: absolute; top: 588px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 300; color: #d4d4d8; }

    <script>
      window.__timelines = window.__timelines || {};
      var stage = document.getElementById("stage");
      var tl = gsap.timeline({ paused: true });

      /* Audio-reactive envelope: pre-extracted music RMS + bass, sampled per frame.
         Drives a single inherited CSS custom property so scenes can breathe subtly. */
      var AD = window.AUDIO_DATA;
      var BASS = AD.bass.split(",").map(Number);
      var RMS = AD.rms.split(",").map(Number);
      var RMAX = 0;
      for (var i = 0; i < RMS.length; i++) { if (RMS[i] > RMAX) RMAX = RMS[i]; }
      for (var f = 0; f < AD.totalFrames; f++) {
        (function (idx) {
          tl.call(function () {
            var p = (RMS[idx] / RMAX) * 0.82 + BASS[idx] * 0.18;
            stage.style.setProperty("--pulse", p.toFixed(3));
          }, [], idx / AD.fps);
        })(f);
      }

      /* closing fade */
      tl.to("#endfade", { opacity: 1, duration: 0.3, ease: "power2.in" }, 19.72);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
