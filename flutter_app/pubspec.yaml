name: flutter_app
description: "FIND-MISSING-PEP — AI-Based Missing Person Detection & Real-Time CCTV Monitoring Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Networking & HTTP
  dio: ^5.4.1
  fetch_client: ^1.1.0

  # Firebase Suite
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  firebase_messaging: ^14.7.19

  # Local Notifications & Media
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.1

  # Maps & Geo-location (Interactive sighting timeline)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Storage & Utilities
  shared_preferences: ^2.2.2
  intl: '>=0.19.0 <=0.20.2'
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
