[backend]
url = http://localhost:8000
enrollment_key = change-me-to-enrollment-key
api_key = fmp_agent_key_dev_seed_998877665544332211

[agent]
device_id = EDGE-CAMPUS-01
location_name = Main Building
sync_interval_seconds = 60
heartbeat_interval_seconds = 30
db_path = local_data.db
evidence_dir = evidence

[ai]
onnx_model_dir = ./models
face_detect_threshold = 0.5
face_similarity_threshold = 0.50
tracking_fps = 15
quality_min_face_size = 40
quality_max_blur = 100
quality_min_aspect = 0.6
