services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmp_user
      POSTGRES_PASSWORD: fmp_pass
      POSTGRES_DB: fmp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmp_user -d fmp_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fmp_user
      - POSTGRES_PASSWORD=fmp_pass
      - POSTGRES_DB=fmp_db
      - DATABASE_URL=postgresql+asyncpg://fmp_user:fmp_pass@postgres:5432/fmp_db
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_ENROLLMENT_KEY=dev-enroll-secret-change-me
      - RTSP_SECRET_KEY=32bytehexsecretforaesencryption00
      - UPLOAD_DIR=/app/uploads
      - AI_MODEL_DIR=/app/ai_models
    volumes:
      - uploads_data:/app/uploads
      - ./tests:/app/tests
      - ./edge_agent:/app/edge_agent
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["seed"]
    command: ["python", "/app/scripts/seed_test_data.py"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fmp_user
      - POSTGRES_PASSWORD=fmp_pass
      - POSTGRES_DB=fmp_db
      - DATABASE_URL=postgresql+asyncpg://fmp_user:fmp_pass@postgres:5432/fmp_db
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_ENROLLMENT_KEY=dev-enroll-secret-change-me
      - RTSP_SECRET_KEY=32bytehexsecretforaesencryption00
      - UPLOAD_DIR=/app/uploads
      - AI_MODEL_DIR=/app/ai_models
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/app/scripts
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  uploads_data:
