services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fmp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmp_user} -d ${POSTGRES_DB:-fmp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-fmp_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fmp_pass}
      - POSTGRES_DB=${POSTGRES_DB:-fmp_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-fmp_user}:${POSTGRES_PASSWORD:-fmp_pass}@postgres:5432/${POSTGRES_DB:-fmp_db}
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_ENROLLMENT_KEY=${ADMIN_ENROLLMENT_KEY:-prod-secret-change-me}
      - RTSP_SECRET_KEY=${RTSP_SECRET_KEY:-32bytehexsecretforaesencryption00}
      - UPLOAD_DIR=/app/uploads
      - AI_MODEL_DIR=/app/ai_models
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web_app:
    build:
      context: ./web_app
      dockerfile: Dockerfile
      args:
        # Pass environment variables needed during build
        VITE_API_BASE_URL: ""
        VITE_ENABLE_MOCK_AUTH: "true"
        VITE_FIREBASE_API_KEY: "${VITE_FIREBASE_API_KEY:-AIzaSyAYnAkbJNRpgAqWvKjmh482QHpW_bhfmOY}"
        VITE_FIREBASE_AUTH_DOMAIN: "${VITE_FIREBASE_AUTH_DOMAIN:-find-missing-pep.firebaseapp.com}"
        VITE_FIREBASE_PROJECT_ID: "${VITE_FIREBASE_PROJECT_ID:-find-missing-pep}"
        VITE_FIREBASE_STORAGE_BUCKET: "${VITE_FIREBASE_STORAGE_BUCKET:-find-missing-pep.firebasestorage.app}"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "${VITE_FIREBASE_MESSAGING_SENDER_ID:-293939241446}"
        VITE_FIREBASE_APP_ID: "${VITE_FIREBASE_APP_ID:-1:293939241446:web:abc1a37cc6ab88e28c3627}"
        VITE_FIREBASE_MEASUREMENT_ID: "${VITE_FIREBASE_MEASUREMENT_ID:-G-H309RWCPC9}"
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
